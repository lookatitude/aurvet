# Dependabot — GitHub Actions only.
#
# There is still no `gomod` ecosystem entry, and now that a dependency exists
# that absence is a stronger decision rather than a leftover.
#
# aurvet has exactly ONE third-party Go dependency: golang.org/x/sys, sanctioned
# by decision D-3 for capset/prctl. CI fails on any other (see ci.yml, "no
# unsanctioned dependencies"). That single dependency is pinned to v0.41.0 for a
# reason automation cannot see: v0.42.0+ declare `go 1.25.0`, so upgrading would
# force this module's `go` directive up and raise the minimum Go for every
# consumer. An unpinned `go get golang.org/x/sys` did exactly that on the first
# attempt, silently rewriting `go 1.24` to `go 1.25.0`.
#
# A gomod entry would therefore generate a weekly PR whose only effect is to
# raise the floor, and "bump the patch version" is the one review posture most
# likely to wave that through. Bumping x/sys is a floor decision, taken by a
# human, with the `go` directive checked in the same diff.
#
# NOTE on the interaction with our SHA pinning: every action in this repository
# is pinned to a commit SHA rather than a tag, deliberately, because a tag is
# mutable. Dependabot understands SHA pins and will propose a new SHA while
# updating the trailing `# vX.Y.Z` comment, which is exactly the reviewable
# behaviour we want. Do NOT "simplify" these PRs by switching back to tags.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits are a contract in this repo: release-please derives
      # the version and changelog from them. A dependabot PR that ignored the
      # convention would produce an unparseable changelog entry.
      prefix: "ci"
    labels:
      - dependencies
    target-branch: dev
