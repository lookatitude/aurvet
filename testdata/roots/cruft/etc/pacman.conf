#
# /etc/pacman.conf -- fixture. This root's admin has ADDED a hook directory.
#
# Both the default admin dir and the extra one are listed explicitly, so this
# file means the same thing whether HookDir is read as "replaces the default" or
# as "appends to it": the hook set is
#
#   usr/share/libalpm/hooks   (system, always active)
#   etc/pacman.d/hooks        (admin default)
#   usr/local/share/pacman-hooks  (this admin's addition)
#
# A scanner that hardcodes the default pair misses the third directory entirely,
# which is a place to hide a hook that no one looks at.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
HookDir     = /etc/pacman.d/hooks/
HookDir     = /usr/local/share/pacman-hooks/
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
