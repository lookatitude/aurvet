#
# /etc/pacman.conf -- fixture. A stock file: no HookDir line, so the hook set is
# exactly the default pair (usr/share/libalpm/hooks, then etc/pacman.d/hooks).
# This root deliberately has NO etc/pacman.d/hooks directory: it is absent on a
# stock Arch install and its absence is a fact to record, never an error and
# never a coverage gap.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
