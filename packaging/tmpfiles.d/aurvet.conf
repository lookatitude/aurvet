# packaging/tmpfiles.d/aurvet.conf -- installed as /usr/lib/tmpfiles.d/aurvet.conf
#
# Creates the system state directory internal/config resolves to for a
# euid==0 run (/var/lib/aurvet; see config.resolveStateDir). An unprivileged
# run resolves to $XDG_STATE_HOME/aurvet instead and needs nothing from here.
#
# MODE 0700, OWNER root:root, and both halves are load-bearing:
#
#   - This tree holds approvals/, snapshots/ and reports/. Whoever can WRITE
#     the approval store can approve their own recipe, so aurvet itself
#     refuses a store that is group- or world-writable or owned by another
#     account (internal/gate/approve.go, checkDirSafe). A laxer mode here does
#     not loosen aurvet; it makes aurvet refuse to run.
#   - It is also not world-READABLE. A scan report names every foreign package
#     on the host and every finding against it -- a map of what to attack, and
#     no unprivileged account needs it.
#
# The subdirectories are deliberately NOT declared here. The stores create
# them 0700 on first write (report/store.go, snapshot/store.go,
# gate/approve.go), and one owner of a mode is better than two that can
# disagree.
#
# `d` (not `D`): create if missing, never empty it on boot. The contents are
# the --since-last baseline and the approval history; wiping them would silently
# re-report every persisting finding as new and re-prompt for every approval.
# Age is empty for the same reason -- nothing in here is ever aged out.
#
# Type Path            Mode UID  GID  Age Argument
d /var/lib/aurvet      0700 root root -
